name: sql_pulse
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dartssh2: ^2.12.0
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  mysql_client: ^0.0.27
  path_provider: ^2.1.5
  postgres: ^3.5.11
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  sqflite_common_ffi: ^2.4.1
  sqlite3: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
